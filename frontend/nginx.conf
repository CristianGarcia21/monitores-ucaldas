server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El navegador solo habla con nginx; /api/* se reenvía al controlador Java.
    # Así la interfaz nunca toca la base de datos ni necesita CORS.
    location /api/ {
        proxy_pass http://java-controller:8081/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
