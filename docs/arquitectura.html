<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura | Gestión de Monitores Académicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45,49,66,0.12);
      --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 56px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .frame { width: min(100%, 1280px); margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 8px var(--font-mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font: 400 clamp(28px, 3vw, 36px)/1.1 var(--font-serif);
      letter-spacing: -0.02em;
    }
    .subtitle {
      max-width: 760px;
      margin-bottom: 28px;
      color: var(--muted);
      font: 400 14px/1.6 var(--font-sans);
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; }
    .zone {
      fill: rgba(45,49,66,0.02);
      stroke: rgba(45,49,66,0.10);
      stroke-width: 0.8;
    }
    .zone-label {
      fill: var(--soft);
      font: 500 8px var(--font-mono);
      letter-spacing: 0.14em;
    }
    .connector {
      fill: none;
      stroke: var(--link);
      stroke-width: 1.2;
      marker-end: url(#arrow-link);
    }
    .node-name {
      fill: var(--ink);
      font: 600 12px var(--font-sans);
      text-anchor: middle;
    }
    .node-sublabel {
      fill: var(--muted);
      font: 400 9px var(--font-mono);
      text-anchor: middle;
    }
    .node-tag {
      font: 500 8px var(--font-mono);
      letter-spacing: 0.06em;
      text-anchor: middle;
    }
    .note {
      fill: var(--muted);
      font: 600 12px var(--font-sans);
      text-anchor: middle;
    }
    .legend-rule { stroke: rgba(45,49,66,0.12); stroke-width: 0.8; }
    .legend-label {
      fill: var(--muted);
      font: 500 8px var(--font-mono);
      letter-spacing: 0.08em;
    }
    @media print {
      @page { size: A4 landscape; margin: 5mm; }
      body { min-height: 0; padding: 0 8px; }
      .eyebrow { margin-bottom: 4px; }
      h1 { margin-bottom: 4px; font-size: 28px; }
      .subtitle { margin-bottom: 8px; font-size: 12px; line-height: 1.3; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sistema distribuido · Universidad de Caldas</p>
    <h1>Arquitectura del sistema</h1>
    <p class="subtitle">El navegador usa una única entrada HTTP. Cada operación atraviesa frontend, Java, PHP y Python; solo Python accede a PostgreSQL.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-title arquitectura-desc">
        <title id="arquitectura-title">Arquitectura de Gestión de Monitores Académicos</title>
        <desc id="arquitectura-desc">Diagrama del flujo HTTP/JSON entre el navegador, nginx, los servicios Java, PHP y Python, y PostgreSQL; Python es el único componente que persiste datos.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect class="zone" x="216" y="184" width="976" height="240" rx="8"/>
        <rect x="232" y="178" width="120" height="16" rx="2" fill="#f5f5f5"/>
        <text class="zone-label" x="240" y="190">DOCKER COMPOSE</text>

        <path class="connector" d="M184 312 H240"/>
        <path class="connector" d="M392 312 H420"/>
        <path class="connector" d="M572 312 H600"/>
        <path class="connector" d="M752 312 H780"/>
        <path class="connector" d="M932 312 H960"/>

        <g aria-label="Navegador">
          <rect x="48" y="264" width="136" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="48" y="264" width="136" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <rect x="60" y="272" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text class="node-tag" x="84" y="281" fill="#4f5d75">CLIENTE</text>
          <text class="node-name" x="116" y="312">Navegador</text>
          <text class="node-sublabel" x="116" y="332">/api/*</text>
        </g>

        <g aria-label="Frontend con nginx">
          <rect x="240" y="264" width="152" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="240" y="264" width="152" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="252" y="272" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text class="node-tag" x="266" y="281" fill="#4f5d75">UI</text>
          <text class="node-name" x="316" y="312">Frontend</text>
          <text class="node-sublabel" x="316" y="332">nginx · :8080 → :80</text>
        </g>

        <g aria-label="Controlador Java">
          <rect x="420" y="264" width="152" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="420" y="264" width="152" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="432" y="272" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text class="node-tag" x="450" y="281" fill="#4f5d75">API</text>
          <text class="node-name" x="496" y="312">Controlador Java</text>
          <text class="node-sublabel" x="496" y="332">Spring Boot · :8081</text>
        </g>

        <g aria-label="Intermediario PHP">
          <rect x="600" y="264" width="152" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="600" y="264" width="152" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="612" y="272" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text class="node-tag" x="636" y="281" fill="#4f5d75">RELAY</text>
          <text class="node-name" x="676" y="312">Servicio PHP</text>
          <text class="node-sublabel" x="676" y="332">cURL · :8082</text>
        </g>

        <g aria-label="Persistencia Python">
          <rect x="780" y="264" width="152" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="780" y="264" width="152" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="792" y="272" width="48" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
          <text class="node-tag" x="816" y="281" fill="#bf4520">FOCAL</text>
          <text class="node-name" x="856" y="312">Servicio Python</text>
          <text class="node-sublabel" x="856" y="332">FastAPI · :8083</text>
        </g>

        <g aria-label="Base de datos PostgreSQL">
          <rect x="960" y="264" width="152" height="96" rx="6" fill="#f5f5f5"/>
          <rect x="960" y="264" width="152" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <rect x="972" y="272" width="48" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
          <text class="node-tag" x="996" y="281" fill="#4f5d75">STORE</text>
          <text class="node-name" x="1036" y="312">PostgreSQL</text>
          <text class="node-sublabel" x="1036" y="332">:5432 · db-data</text>
        </g>

        <text class="note" x="640" y="488">Solo Python abre conexiones con PostgreSQL.</text>
        <text x="640" y="516" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">HTTP + JSON · las respuestas regresan por la misma cadena</text>

        <line class="legend-rule" x1="40" y1="640" x2="1240" y2="640"/>
        <rect x="48" y="662" width="14" height="14" rx="2" fill="none" stroke="#2e5aa8" stroke-width="1.2"/>
        <line x1="51" y1="669" x2="60" y2="669" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text class="legend-label" x="72" y="672">HTTP / JSON</text>

        <rect x="280" y="662" width="14" height="14" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text class="legend-label" x="304" y="672">CLIENTE EXTERNO</text>

        <rect x="536" y="662" width="14" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="legend-label" x="560" y="672">COMPONENTES DE APP</text>

        <rect x="824" y="662" width="14" height="14" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text class="legend-label" x="848" y="672">PERSISTENCIA</text>

        <rect x="1040" y="662" width="14" height="14" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text class="legend-label" x="1064" y="672">BASE DE DATOS</text>
      </svg>
    </div>
  </main>
</body>
</html>
